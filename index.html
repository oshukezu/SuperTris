<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <title>SUPERTRIS</title>
  <!-- 開源 8-Bit 像素中文 (俐方體 11 號) 與英文字型 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cubic-11@1.010/fonts/web/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="in-title">

  <!-- 橫向鎖定警告 (禁止橫向操作) -->
  <div id="landscape-warning">
    <p data-i18n="portrait_warning">[NOTICE] 請轉為直向模式遊玩（禁止橫向操作）</p>
  </div>

  <!-- ============================================================
       頂部雙層全域常駐 HUD (首頁純藍底懸浮第一行，進遊戲展開第二行)
       ============================================================ -->
  <header class="global-header-wrapper">
    <!-- 第一行：NES 經典四欄數據 (全站位置與字級 100% 固定) -->
    <div class="nes-top-hud-row">
      <div class="hud-col"><span class="hud-sub">MARIO</span><span id="hud-score" class="hud-main">000000</span></div>
      <div class="hud-col"><span class="hud-sub">💎</span><span class="hud-main"><strong id="hud-coins">0</strong>/100</span></div>
      <div class="hud-col"><span class="hud-sub">WORLD</span><span id="hud-world" class="hud-main">1-1</span></div>
      <div class="hud-col"><span class="hud-sub">TIME</span><span id="hud-time" class="hud-main">--:--</span></div>
    </div>

    <!-- 第二行：輔助資訊 4 欄等寬橫排 (與第一行 100% 垂直對齊，首頁時隱藏) -->
    <div class="sub-hud-row">
      <div class="sub-hud-col">
        <span class="sub-lbl" data-i18n="next">NEXT</span>
        <canvas id="next-canvas" width="28" height="28"></canvas>
      </div>
      <div class="sub-hud-col">
        <span class="sub-lbl">🍄 LIFE</span>
        <span id="hud-lives" class="sub-val" style="color: #2ecc71;">3</span>
      </div>
      <div class="sub-hud-col">
        <span class="sub-lbl" data-i18n="lines">LINES</span>
        <span id="hud-lines" class="sub-val">0</span>
      </div>
      <div class="sub-hud-col">
        <!-- 雙人模式時切換為職責標籤，單人模式時為純文字 SET 按鈕 -->
        <button class="pixel-btn pixel-btn-accent set-nav-btn" id="set-menu-btn">SET</button>
        <div id="header-role-badge" class="header-role-badge hidden">P1 ↔</div>
      </div>
    </div>

    <!-- [SET] 下拉收折抽屜選單 -->
    <div id="set-drawer" class="set-drawer hidden">
      <button class="pixel-btn drawer-btn" id="lang-toggle-btn">EN</button>
      <button class="pixel-btn drawer-btn" id="mute-toggle-btn">SOUND: ON</button>
      <button class="pixel-btn drawer-btn" id="pause-btn" data-i18n="pause">PAUSE</button>
      <button class="pixel-btn drawer-btn pixel-btn-red" id="menu-btn" data-i18n="main_menu">MAIN MENU</button>
      <button class="pixel-btn drawer-btn pixel-btn-accent" id="leaderboard-btn" data-i18n="leaderboard">RANKINGS</button>
    </div>

    <!-- 道具 Buff 狀態列與像素進度條 -->
    <div id="active-powerups" class="active-buffs" style="min-height: 12px;"></div>
  </header>

  <!-- ============================================================
       1985 NES 經典全螢幕首頁內容 (置於頂部第一行下方)
       ============================================================ -->
  <section id="title-screen" class="nes-title-screen">
    <!-- 經典復古棕色木牌大標題 -->
    <div class="nes-wood-board">
      <div class="screw screw-tl"></div>
      <div class="screw screw-tr"></div>
      <div class="screw screw-bl"></div>
      <div class="screw screw-br"></div>
      <h1 class="nes-logo-text">SUPER<br>TRIS</h1>
      <div class="nes-copyright">©2026 SUPERTRIS</div>
    </div>

    <!-- 經典 1P / 2P 選單按鈕 (21px Bold) -->
    <div class="nes-menu">
      <button class="nes-menu-item" id="play-single-btn">
        <span class="nes-cursor">🍄</span>
        <span data-i18n="play_single">1P player</span>
      </button>
      <button class="nes-menu-item" id="play-coop-btn">
        <span class="nes-cursor">🍄</span>
        <span data-i18n="play_coop">2P player</span>
      </button>
    </div>

    <!-- 底部 10 秒 1x4 堆疊消 4 行 Demo 動畫 -->
    <div class="nes-stack-bottom">
      <div class="demo-tetris-grid">
        <!-- 4 層 9 寬積木牆 (最右側第 10 格空出) -->
        <div class="demo-wall-row r4">
          <div class="d-cell b-red d-1"></div><div class="d-cell b-gold d-2"></div><div class="d-cell b-blue d-3"></div>
          <div class="d-cell b-green d-4"></div><div class="d-cell b-red d-5"></div><div class="d-cell b-gold d-6"></div>
          <div class="d-cell b-blue d-7"></div><div class="d-cell b-green d-8"></div><div class="d-cell b-red d-9"></div>
          <div class="d-cell empty"></div>
        </div>
        <div class="demo-wall-row r3">
          <div class="d-cell b-gold d-10"></div><div class="d-cell b-blue d-11"></div><div class="d-cell b-green d-12"></div>
          <div class="d-cell b-red d-13"></div><div class="d-cell b-gold d-14"></div><div class="d-cell b-blue d-15"></div>
          <div class="d-cell b-green d-16"></div><div class="d-cell b-red d-17"></div><div class="d-cell b-gold d-18"></div>
          <div class="d-cell empty"></div>
        </div>
        <div class="demo-wall-row r2">
          <div class="d-cell b-blue d-19"></div><div class="d-cell b-green d-20"></div><div class="d-cell b-red d-21"></div>
          <div class="d-cell b-gold d-22"></div><div class="d-cell b-blue d-23"></div><div class="d-cell b-green d-24"></div>
          <div class="d-cell b-red d-25"></div><div class="d-cell b-gold d-26"></div><div class="d-cell b-blue d-27"></div>
          <div class="d-cell empty"></div>
        </div>
        <div class="demo-wall-row r1">
          <div class="d-cell b-green d-28"></div><div class="d-cell b-red d-29"></div><div class="d-cell b-gold d-30"></div>
          <div class="d-cell b-blue d-31"></div><div class="d-cell b-green d-32"></div><div class="d-cell b-red d-33"></div>
          <div class="d-cell b-gold d-34"></div><div class="d-cell b-blue d-35"></div><div class="d-cell b-green d-36"></div>
          <div class="d-cell empty"></div>
        </div>
        <!-- 1x4 垂直長條方塊 (7.5s 直落插進第 10 格空槽) -->
        <div class="demo-i-piece">
          <div class="d-cell b-cyan"></div>
          <div class="d-cell b-cyan"></div>
          <div class="d-cell b-cyan"></div>
          <div class="d-cell b-cyan"></div>
        </div>
      </div>

      <div class="nes-scenery-ground">
        <div class="nes-hill"></div>
        <div class="nes-bush"></div>
        <div class="nes-ground"></div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       遊戲主畫面 (Flexbox 自適應棋盤)
       ============================================================ -->
  <main id="game-main-area" class="game-main-area hidden">
    <div class="game-layout" id="touch-gesture-area">
      <div class="canvas-container">
        <canvas id="game-canvas" width="340" height="680"></canvas>
        <div id="item-toast" class="item-toast hidden"></div>
        <div id="tetris-firework-fx" class="tetris-fx hidden"></div>
      </div>
    </div>
  </main>

  <!-- 全螢幕暫停遮罩 (點擊全螢幕任意像素皆可無縫恢復) -->
  <div id="pause-overlay" class="modal-backdrop hidden" style="cursor: pointer; z-index: 92;">
    <h2 style="color: var(--accent-gold); font-size: 22px; letter-spacing: 2px;">PAUSED</h2>
  </div>

  <!-- 雙人跨裝置配對房間 Modal (產生代碼 / 輸入代碼 一步到位) -->
  <div id="room-modal" class="modal-backdrop hidden">
    <div class="pixel-modal room-modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 class="modal-title" data-i18n="room_title">雙人連線合作</h2>
        <button class="pixel-btn pixel-btn-red" id="btn-close-room-modal" style="padding: 4px 8px;">X</button>
      </div>

      <!-- 上半部：產生代碼 (P1 房主) -->
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
        <div style="font-size: 13px; color: var(--accent-gold); font-weight: bold;" data-i18n="share_code_title">產生代碼</div>
        <div id="display-room-code" style="font-size: 42px; font-weight: bold; letter-spacing: 6px; color: #ffffff; background: #000; padding: 6px 18px; border: 2px solid var(--accent-gold);">8888</div>
        <div style="font-size: 11px; color: #aaa;" class="pixel-pulse" data-i18n="waiting_partner">等待隊友加入中...</div>
      </div>

      <!-- 分隔字 -->
      <div style="font-size: 12px; color: #888;" data-i18n="or_divider">或</div>

      <!-- 下半部：輸入代碼 (P2 隊友) - 支援電話純數字鍵盤 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; color: var(--accent-gold); font-weight: bold;" data-i18n="enter_code_title">輸入代碼</div>
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="join-code-input" class="pixel-input" maxlength="4" placeholder="請輸入代碼" data-i18n-placeholder="enter_code_title" />
        <button class="pixel-btn pixel-btn-accent room-action-btn" id="btn-join-room" data-i18n="join_room_btn">加入房間</button>
      </div>

      <!-- 合作分工規則說明 (零 Emoji、單行) -->
      <div class="coop-rules-card" style="margin-top: 4px;">
        <div class="coop-rules-item" style="font-size: 11px; color: #ccc;" data-i18n="coop_rule_text">規則：P1 負責左右移動，P2 負責旋轉與加速</div>
      </div>

      <div id="room-error-msg" style="color: #e74c3c; font-size: 11px;"></div>
    </div>
  </div>

  <!-- Game Over 結算 Modal -->
  <div id="game-over-modal" class="modal-backdrop hidden">
    <div class="pixel-modal">
      <h2 class="modal-title" data-i18n="game_over">GAME OVER</h2>
      <div id="go-new-record" class="hidden" style="color: #f1c40f;" data-i18n="new_record">[NEW RECORD] 歷史新高！</div>

      <div class="stats-grid">
        <div><span data-i18n="score">SCORE</span>: <strong id="go-score">0</strong></div>
        <div><span data-i18n="cleared_lines">LINES</span>: <strong id="go-lines">0</strong></div>
        <div><span data-i18n="max_combo">COMBO</span>: <strong id="go-combo">0</strong></div>
        <div style="grid-column: span 2; color: var(--accent-gold);">
          超越了 <strong id="go-percent">99</strong>% 玩家！
        </div>
      </div>

      <input type="text" id="player-name-input" class="pixel-input" maxlength="20" data-i18n-placeholder="enter_name" placeholder="請輸入暱稱" />

      <button class="pixel-btn pixel-btn-accent room-action-btn" id="btn-submit-score" data-i18n="submit_score">上傳紀錄</button>
      <div style="display: flex; gap: 10px;">
        <button class="pixel-btn" id="btn-play-again" style="flex: 1; padding: 12px 6px;" data-i18n="play_again">再玩一次</button>
        <button class="pixel-btn pixel-btn-red" id="btn-back-menu" style="flex: 1; padding: 12px 6px;" data-i18n="back_menu">主選單</button>
      </div>
    </div>
  </div>

  <!-- 排行榜 Modal (固定 TOP 10 高度) -->
  <div id="leaderboard-modal" class="modal-backdrop hidden">
    <div class="pixel-modal" style="min-height: 420px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 class="modal-title" data-i18n="leaderboard">排行榜</h2>
        <button class="pixel-btn pixel-btn-red" id="leaderboard-close-btn" style="padding: 4px 8px;">X</button>
      </div>

      <div class="lb-tabs">
        <button class="pixel-btn lb-tab active" id="tab-single" data-i18n="single_rank">單人榜</button>
        <button class="pixel-btn lb-tab" id="tab-coop" data-i18n="coop_rank">雙人榜</button>
      </div>

      <div id="leaderboard-list" class="lb-list"></div>
    </div>
  </div>

  <!-- 外部函式庫與核心模組 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/supabase-service.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/multiplayer.js"></script>
  <script src="js/mario.js"></script>
  <script src="src/piece.js"></script>
  <script src="src/score.js"></script>
  <script src="src/board.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/controls.js"></script>
  <script src="src/tetris.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.I18N.init();
      window.SupabaseService.init();
      window.Leaderboard.init();
      window.gameInstance = new window.SuperTrisGame();
    });
  </script>
</body>
</html>
